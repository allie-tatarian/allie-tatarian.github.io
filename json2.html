<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Problem Set 5</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="json-data"></div>
    <div id="json-parsed"></div>
    <script language="javascript">
      // Copied this directly from json09_get.html and then modified. 
      // Replaced the "get" URL with the URL pointing to my data.
      // Replaced the <ul> tags with <div> tags for the formatted songs
      // Updated the HTML in the formatting section to make it not a list.
      $.get( "https://allie-tatarian.github.io/songs.json", 
			function( data ) {

        //Turns the data into a string and prints it in the div with ID "json-data."
				str = JSON.stringify(data);		//data is a json object
				document.getElementById('json-data').innerHTML = str;

        //These two lines pull JUST the song data from the JSON file.
        //First, it turns ONLY the song array into a string,
        //then, it turns that string back into its own JSON object.
        let songList = JSON.stringify(data.songs);
        let obj = JSON.parse(songList);

        //This loop prints the data for each song. 
        // First, the string variable str adds a line break and puts everything in a div.
        // Then, for each song in the array, it pulls out all of the data
        // and parses it into easy-to-read HTML.
        // finally, the str variable adds a closing div tag and the entire
        // string prints to the div with ID "json-parsed"
				str = "<br /><div>";
				obj.forEach(function(songs) { 
				str += "<b>" 
					+ songs.title + "</b><br />Artist: " 
					+ songs.artist + "<br />Genre: "
          + songs.genre + "<br />Released "
          + songs.release_year + "<br /><br />";
				}) 
        str += "</div>";
        document.getElementById('json-parsed').innerHTML = str;  
        })
    </script>
  </body>
</html>
