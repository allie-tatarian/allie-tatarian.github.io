<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Problem Set 5</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  </head>
  <body>
    <form>
      <select id="mySelect">
        <div id="genre-list"></div>
      </select>
      <button id="btn">Filter</button>
    </form>
    <div id="song-titles"></div>
    <script language="javascript">
      // Copied this directly from json09_get.html and then modified. 
      // Replaced the "get" URL with the URL pointing to my data.
      // Replaced the <ul> tags with <div> tags for the formatted songs
      // Updated the HTML in the formatting section to make it not a list.
      $.get( "https://allie-tatarian.github.io/songs.json", 
			function( data ) {
				console.log('raw data\n'+ data)
				str = JSON.stringify(data);		//data is a json object


                //Step one: Getting genres into select. This works in the same way as problem 4 from problem set 4.
                // First, we stringify JUST the genre info from the JSON file.
                // Then, we split the genre info by [","], which is in-between each genre in the list.
                // It's written like "\",\"" to escape the double quotes. The slice(2, -2) is to 
                // trim the leading and trailing [" and "].
                // Then, the genres are joined together with option tags and put between the select tags.
                genres = JSON.stringify(data.genres);
                genres = genres.split("\",\"").join("</option><option>").slice(2, -2);
                document.getElementById('genre-list').innerHTML = "<option>" + genres + "</option>";
                

                // Same as json2.html, this lets us just get the song list from the JSON file.
                let songList = JSON.stringify(data.songs);
        		    let obj = JSON.parse(songList);
                
                //This is the event listener for the button
                document.getElementById("btn").addEventListener("click", songTitles);
                
                //Once the button is clicked, the function will grab the selected option from the select.
                // This works in the same way as in ps4_4.html, and the option selected is stored in selectedValue.
                // Then, we loop through the songs. At each step of the loop, we loop through the genres (the for loop).
                // At each step of the genre loop, if the genre is the same as the one selected, the song is added to the list.
                // Finally, the list of songs is printed in the div with id "song-titles"
                function songTitles() {
                	str = "<br /><div>";
                    var select = document.getElementById("mySelect");
                    var selectedIndex = select.selectedIndex;
                    var options = select.options;
                    var selectedValue = options[selectedIndex].value;
                    obj.forEach(function(songs) {
                      for (let i=0; i < songs.genre.length; i++) {
                          if (songs.genre[i] == selectedValue) {
                              str += songs.title + "<br />";
                              }
                          }
                    }) 
                   str += "</div>";
                    document.getElementById('song-titles').innerHTML = str;  
                }

				
        
	})
    </script>
  </body>
</html>
