<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">
    <title>CS120 - Project 2</title>
    <link rel="stylesheet" type="text/css" href="https://allie-tatarian.github.io/project2/style.css"  />
    <style>
      /* Classes to style what you see when you open the page. */
      
      .container {
        margin-top: 20px;
        margin-bottom: 15px;
      }
      
      .letter {
        height: 50px;
        width: 50px;
        border: 2.5px solid gray;
        margin: 5px;
        text-align: center;
        vertical-align: middle;
        color: #444;
        font-weight: bold;
        font-size: 30px;
        padding-top: 5px;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        justify-content: center;
        align-items: center;
        /* Got this centering method from https://www.w3schools.com/css/tryit.asp?filename=trycss3_flexbox_perfect_center */
      }

      .krow {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .keyboard {
        background-color: #c4c4c4;
        padding: 15px 0px;
        width: 95%;
        margin: 0px auto;
        border: 0px;
        border-radius: 15px;
        max-width: 320px;
      }

      .key {
        height: 25px;
        width: 15px;
        border: 1px solid gray;
        border-radius: 2px;
        text-align: center;
        padding: 6px 3px 2px 3px;
        margin: 2px;
        background-color: #eee;
        font-family: Arial;
        /*cursor: pointer;*/
      }

      .btn-container {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .button {
        margin: -10px 5px 0px 5px;
        height: 25px;
        width: 90px;
        background-color: #eee;
        border: 1px solid gray;
        border-radius: 5px;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      input {
        margin-bottom: 8px;
      }

      /* Media breakpoint; makes the game a little more compact on mobile.*/
      /* Red keyboard background is for TESTING ONLY, take out when done. */

      @media only screen and (max-width: 400px) {
        .keyboard {background: red; width: 98%; max-width: 300px;}
        .key {padding: 4px 1px 0px 1px;}
        .letter {margin: 5px 1px;}
      }

      /* This section adds styling as you play the game. */

      .wrong {
        background-color: gray;
        color: #eee;
        font-weight: bold;
      }

      .move {
        background-color: darkkhaki;
        color: #eee;
        font-weight: bold;
      }

      .correct {
        background-color: green;
        color: #eee;
        font-weight: bold;
      }

      .used {
        background-color: darkgray;
        color: white;
        border: 1px solid darkgray;
      }

    </style>
  </head>

    <form name="form" class="container btn-container">
        <input type="text" name="guess" id="guess" placeholder="SLATE" minlength=5 maxlength=5/><br />
        <!--I found <input type="button"> easier to use than <button>, at least for testing.-->
        <input type="button" id="guess-btn" value="Guess" class="button"><br />
        <input type="button" id="reset" value="Reset" class="hidden button"><br />

    <script src="https://allie-tatarian.github.io/project2/script.js"></script>
    <script>
      //Initializing variables
      let turn = 0;
      let win = 0;
      let glitch = 0;
      let resetbtn = document.getElementById("reset");
      let guessbtn = document.getElementById("guess-btn");
      const key = document.getElementsByClassName("key");
      var keyArr = [].slice.call(key);

     let words = ["naval", "serve", "heath", "dwarf", "model", "karma", "grade", "quiet", "bench", "abate", "feign", "major", "death", "fresh", "crust", "funny", "queue", "abase", "marry", "react", "batty", "pride", "floss", "helix", "croak", "staff", "paper", "unfed", "whelp", "trawl",];

      //These hold the classes for the letter boxes, used in functions below
      const one = document.getElementsByClassName("one");
      const two = document.getElementsByClassName("two");
      const three = document.getElementsByClassName("three");
      const four = document.getElementsByClassName("four");
      const five = document.getElementsByClassName("five");
      const row = document.getElementsByClassName("row");
      const letter = document.getElementsByClassName("letter");
      

      
      // To get a random word, we get a random number 0-29. This will be the index of our Wordle word.
      index = Math.floor(Math.random() * 30);
      wordle = words[index];
      wordleLetters = wordle.split("");
      console.log(wordle);
      
      class myGuess {
          constructor() {
            this.guess = document.form.guess.value.toLowerCase();
            this.guessLetters = this.guess.split("");
          }
          checkLength() {
          	if (this.guess.length !=5 || win == 1) {
            	glitch = 1;
            } else { glitch = 0; }
          }
          checkDict() {
          // The API works but it's not waiting. Try to troubleshoot using this later: https://www.geeksforgeeks.org/javascript/how-to-make-javascript-wait-for-a-api-request-to-return/
          	var url = "https://freedictionaryapi.com/api/v1/entries/en/" + this.guess;
            console.log(url);
          	fetch(url)
            .then (res => res.text())
            .then (response => 
            {
                console.log("Response: " + response);
                const respObj = JSON.parse(response);
                const entry = respObj.entries;
				if (entry.length === 0) {glitch = 1;}
            })
          }
          fillBoard() {
          	if (glitch == 1) {
                return
            } else {
            one[turn].innerHTML = this.guessLetters[0];
            two[turn].innerHTML = this.guessLetters[1];
            three[turn].innerHTML = this.guessLetters[2];
            four[turn].innerHTML = this.guessLetters[3];
            five[turn].innerHTML = this.guessLetters[4];
            }
          }
          compareWordle() {
          if (glitch == 1) {
            	return
            } else {
          	for (let i = 0; i < 5; i++) {
            	const which = turn * 5 + i;
                letter[which].classList.add("wrong");
            	if (this.guessLetters[i] === wordleLetters[i]) {
                	letter[which].classList.add("correct");
                    wordleLetters[i] = "-"; //This replaces the letter with 0, incase other copies of the same letter are there.
                }
            }
            for (let i = 0; i < 5; i++) {
                const which = turn * 5 + i;
                for (let j = 0; j < 5; j++) {
                	if (this.guessLetters[i] === wordleLetters[j] && i != j) {
                        letter[which].classList.add("move");
                    	wordleLetters[j] = "-";
                    }
                }
            }
            wordleLetters = wordle.split("");
            }
          }
          updateKeyboard() {
          if (glitch == 1) {
            	return
            } else {
          for (let i = 0; i < 26; i++) {
          		const thisKey = key[i].innerHTML;
            	const letter = extractContent(thisKey).toLowerCase();
            	for (let j = 0; j < 5; j++) {
                   	if (this.guessLetters[j] === letter) {
                    	if (this.guessLetters[j] === wordleLetters[j]) {
                        	key[i].classList.add("correct");
                        } else if (this.guessLetters[j] === wordleLetters[0] || this.guessLetters[j] === wordleLetters[1] || this.guessLetters[j] === wordleLetters[2] || this.guessLetters[j] === wordleLetters[3] || this.guessLetters[j] === wordleLetters[4]) {
                        //Less than idea way to call for this, but I didn't want to add another loop :(
                        	key[i].classList.add("move");
                        } else {
                        	key[i].classList.add("wrong");
                        }
                    }
                }
          }
          }
          }
          win() {
          	if (this.guess === wordle) {
            	win = 1;
                alert("You win! The word was " + wordle);
            }
          }
          show() {
            return 'My guess is ' + this.guess;
          }
        }
      
      //This is a function to get the text of each key using the "key" class. Idea from: https://stackoverflow.com/questions/28899298/extract-the-text-out-of-html-string-using-javascript
        function extractContent(html) {
              return new DOMParser()
                      .parseFromString(html, "text/html")
                      .documentElement.textContent;
        }
        //works by using: extractContent(key[i].innerHTML);
        // i = 0-25

      //This part of the function is grabbing the guessed word out of the input.
      function guess() {

         const newGuess = new myGuess();
            newGuess.checkDict();
            newGuess.checkLength();
            newGuess.fillBoard();
            newGuess.compareWordle();
            newGuess.updateKeyboard();
            newGuess.win();
            
          if (glitch == 0) {turn += 1;}

          if (turn == 6 && win == 0) {
            alert("You lose! The word was " + wordle);
          }

          if (win == 1 || turn == 6) {
            resetbtn.classList.remove("hidden");
            guessbtn.classList.add("hidden");
          }
        }

	  //function to wipe the classes from the keys. Should work with forEach. Only works if you include both item and index, even though item is not used.
	const wipeKeys = (item, index) => {
        key[index].classList.remove("correct", "move", "wrong");
    }

      function reset() {
        for (let i = 0; i < 6; i++) {
  				one[i].classList.remove("correct", "move", "wrong");
                one[i].innerHTML = "";
                two[i].classList.remove("correct", "move", "wrong");
                two[i].innerHTML = "";
                three[i].classList.remove("correct", "move", "wrong");
                three[i].innerHTML = "";
                four[i].classList.remove("correct", "move", "wrong");
                four[i].innerHTML = "";
                five[i].classList.remove("correct", "move", "wrong");
                five[i].innerHTML = "";
			  }
        keyArr.forEach(wipeKeys);
        resetbtn.classList.add("hidden"); 
        guessbtn.classList.remove("hidden");
        index = Math.floor(Math.random() * 30);
        wordle = words[index];
        wordleLetters = wordle.split("");
        console.log(wordle);
        turn = 0;
        win = 0;
        lose = 0;
        glitch = 0;
      } 

      window.onload = function () {
        guessbtn.addEventListener("click", guess);
        resetbtn.addEventListener("click", reset);
      }
      
      // Potential API for cross-checking words: https://developer.oxforddictionaries.com/dictionary-api; https://www.opendictionaryapi.com/; https://developer.wordnik.com/
      // More: https://freedictionaryapi.com/api/v1#GET/entries/{language}/{word} (most promising!!)
      // API is https://freedictionaryapi.com/api/v1#GET/entries/en/{word} - when not a word, get "entries": []; otherwise, "entries" will have...entries...
    </script>
