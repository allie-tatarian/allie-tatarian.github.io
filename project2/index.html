<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CS120 - Project 2</title>
    <link rel="stylesheet" type="text/css" href="https://allie-tatarian.github.io/project2/style.css"  />
  </head>
  <body>
    <div class="container">
      <!--This first container holds the letter boxes that your guesses go into.-->
      <div class="row">
        <!--Each row has 5 letter boxes, with classes labelling them one-five-->
        <div class="letter one"></div>
        <div class="letter two"></div>
        <div class="letter three"></div>
        <div class="letter four"></div>
        <div class="letter five"></div>
      </div>
      <div class="row">
        <div class="letter one"></div>
        <div class="letter two"></div>
        <div class="letter three"></div>
        <div class="letter four"></div>
        <div class="letter five"></div>
      </div>
      <div class="row">
        <div class="letter one"></div>
        <div class="letter two"></div>
        <div class="letter three"></div>
        <div class="letter four"></div>
        <div class="letter five"></div>
      </div>
      <div class="row">
        <div class="letter one"></div>
        <div class="letter two"></div>
        <div class="letter three"></div>
        <div class="letter four"></div>
        <div class="letter five"></div>
      </div>
      <div class="row">
        <div class="letter one"></div>
        <div class="letter two"></div>
        <div class="letter three"></div>
        <div class="letter four"></div>
        <div class="letter five"></div>
      </div>
      <div class="row">
        <div class="letter one"></div>
        <div class="letter two"></div>
        <div class="letter three"></div>
        <div class="letter four"></div>
        <div class="letter five"></div>
      </div>
    </div>

    <div class="container keyboard">
      <!--This is the container for the keyboard. It has 3 rows with letters in separate "key" divs, following a standard QWERTY keyboard layout.-->
      <div class="krow">
        <div class="key">Q</div>
        <div class="key">W</div>
        <div class="key">E</div>
        <div class="key">R</div>
        <div class="key">T</div>
        <div class="key">Y</div>
        <div class="key">U</div>
        <div class="key">I</div>
        <div class="key">O</div>
        <div class="key">P</div>
      </div>
      <div class="krow">
        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>
        <div class="key">F</div>
        <div class="key">G</div>
        <div class="key">H</div>
        <div class="key">J</div>
        <div class="key">K</div>
        <div class="key">L</div>
      </div>
      <div class="krow">
        <div class="key">Z</div>
        <div class="key">X</div>
        <div class="key">C</div>
        <div class="key">V</div>
        <div class="key">B</div>
        <div class="key">N</div>
        <div class="key">M</div>
      </div>
    </div>

    <form name="form" class="container form-container">
      <!--The final section is a form. I had an easier time coding it as a form than a div.-->
        <input type="text" name="guess" id="guess" placeholder="SLATE" minlength=5 maxlength=5/><br />
        <!--The input does a good job of limiting your guess to 5 letters, but you can still guess fewer.-->

        <!--I found <input type="button"> easier to use than <button>, at least for testing.-->
          <!--The reset button is hidden until you win or lose. The "hidden" class then moves to the guess button.-->
        <input type="button" id="guess-btn" value="Guess" class="button"><br />
        <input type="button" id="reset" value="Reset" class="hidden button"><br />
    </form>    

    <script src="https://allie-tatarian.github.io/project2/script.js"></script>
  </body>
</html>
