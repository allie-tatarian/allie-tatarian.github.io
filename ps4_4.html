<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>CS120 Problem Set 4</title>
  </head>
  <body>

    <!--This is the code for the select and the two buttons. The select tag just has a div inside for now, and the options will be put inside the div by JS when the page first loads.-->
    <select size=8 id="mySelect">
        <div id="states"></div>
    </select>
    <button id="btn1">Add State</button>
    <button id="btn2">Clear States</button>
    <hr />

    <div id="answer"></div>
    
    <p id="demo"></p>

    <script>
		//This code takes an array of state names and makes them options in the select field above. Each state will be between <option> tags.
        states = "Alabama, Alaska, Arizona, Arkansas, California, Colorado, Connecticut, Delaware";
        list = states.split(', ').join('</option><option>');
        document.getElementById("states").innerHTML = "<option>" + list + "</option>";
        
        //This code makes event listeners for each button. When "Add State" is clicked, the function "moveStates" runs.
        //When "Clear States" is clicked, the function "clearStates" runs.
        document.getElementById("btn1").addEventListener("click", moveStates);
        document.getElementById("btn2").addEventListener("click", clearStates);

		//got code/idea for this from https://javascriptsource.com/3-ways-to-get-the-selected-value-in-a-dropdown-list-using-javascript/ (the method from the lecture slides did not work for me)
        function moveStates() {
          //This variable selects the entire "Select" section, including the options inside.
          var select = document.getElementById("mySelect");
          // This variable gets the index (0-7 for 8 states) that the user selected.
        	var selectedIndex = select.selectedIndex;
          // This variable grabs the option tags inside of the select tags.
        	var options = select.options;
          // This variable grabs the text inside of the option tag that is selected. So if index=0, it grabs the text in the first option tag ("Alabama" usually)
        	var selectedValue = options[selectedIndex].value;
          // This grabs the "answer" div and adds the text from selectedValue plus a line break. I used += so I can add multiple states.
        	document.getElementById("answer").innerHTML += selectedValue + "<br />";
          // This removes the selectedIndex from the options.
          select.remove(selectedIndex); //found this here: https://developer.mozilla.org/en-US/docs/Web/API/HTMLSelectElement/remove
        }
        
        // This function removes the states from the "answer" div and resets the options. It just clears both the answer div and the options (replaces them with "") and repopulates the options in the same way they were populated when the page first loaded.
        function clearStates() {
        	document.getElementById("states").innerHTML = "";
          document.getElementById("answer").innerHTML = "";
        	states = "Alabama, Alaska, Arizona, Arkansas, California, Colorado, Connecticut, Delaware";
        	list = states.split(', ').join('</option><option>');
        	document.getElementById("states").innerHTML = "<option>" + list + "</option>";
        }

    </script>
  </body>
</html>
